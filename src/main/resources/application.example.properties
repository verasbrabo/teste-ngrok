spring.application.name=Projeto-Furlan

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projeto-furlan}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
                                ## Isso aqui faz aparecer as mensagens de erro
spring.web.error.include-message=always  

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${USER_APP_SEND_EMAIL}
spring.mail.password=${SENHA_APP_SEND_EMAIL}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

api.security.token.secret=${JWT_SECRET:change-me}

# AES key/salt used to re-display employee passwords in the management flow.
# Define these values through environment variables outside Git.
app.senha.cripto.chave=${SENHA_CRIPTO_CHAVE:change-me}
app.senha.cripto.salt=${SENHA_CRIPTO_SALT:change-me}
