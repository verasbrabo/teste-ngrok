# Configuracao usada somente no deploy do Clever Cloud.
spring.application.name=Projeto-Furlan
server.address=0.0.0.0
server.port=${PORT:8080}

# Banco de dados configurado por variaveis do ambiente de hospedagem.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Mantem as mensagens de erro esperadas pelos aplicativos Flutter.
spring.web.error.include-message=always

# Servidor responsavel pelos e-mails de recuperacao de senha.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply.projeto.apollo@gmail.com
spring.mail.password=${SENHA_APP_SEND_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Limites dos arquivos enviados pelos aplicativos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Segredos definidos somente nas variaveis do Clever Cloud.
api.security.token.secret=${JWT_SECRET}
app.senha.cripto.chave=${SENHA_CRIPTO_CHAVE}
app.senha.cripto.salt=${SENHA_CRIPTO_SALT}
